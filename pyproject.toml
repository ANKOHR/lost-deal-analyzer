[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lost-deal-analyzer"
version = "1.0.0"
description = "Deterministic analysis of explicitly recorded opportunity outcomes"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lda = "lost_deal_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["lost_deal_analyzer*"]
